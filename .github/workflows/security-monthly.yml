name: Monthly Security Scan

on:
  schedule:
    - cron: '0 9 1-7 * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Scan each Lambda (Trivy)
        run: |
          set -euo pipefail
          for dir in lambdas/*/; do
            echo "::group::trivy ${dir}"
            docker run --rm -v "$PWD:/src" aquasec/trivy:0.56.2 fs \
              --severity CRITICAL,HIGH \
              --exit-code 0 \
              --ignore-unfixed \
              "/src/${dir}"
            echo "::endgroup::"
          done
