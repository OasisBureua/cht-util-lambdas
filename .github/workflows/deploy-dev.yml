name: Deploy to Development

# Manual: Actions → Deploy to Development → Run workflow (pick feature/* or main).
# Automatic: push to feature/** (lambda / infra / scripts / workflow paths).
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: skip apply approval and deploy steps'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all Lambdas (ignore change detection)'
        type: boolean
        default: false
  push:
    branches:
      - 'feature/**'
    paths:
      - 'lambdas/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: deploy-cht-util-lambdas-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  TERRAFORM_VERSION: 1.10.5
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_VAR_FILE: ../variables/dev.github.tfvars
  TF_BACKEND_CONFIG: ../backends/us-east-1-dev.hcl
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    outputs:
      lambdas_json: ${{ steps.scope.outputs.lambdas_json }}
      has_lambdas: ${{ steps.scope.outputs.has_lambdas }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      base_source: ${{ steps.base.outputs.base_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-dev.yml" \
            "${{ github.ref_name }}" \
            "origin/main"

      - name: Detect changed Lambdas
        id: scope
        run: |
          chmod +x scripts/ci-detect-changed-lambdas.sh
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            echo "No change base SHA; deploying all Lambdas."
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-changed-lambdas.sh \
            "$FORCE_ALL" \
            "${{ steps.base.outputs.base_sha || '' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_lambdas == 'true' || needs.changes.outputs.deploy_infra == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        if: needs.changes.outputs.has_lambdas == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: lambdas/**/requirements*.txt

      - name: Test changed Lambdas
        if: needs.changes.outputs.has_lambdas == 'true'
        env:
          LAMBDAS_JSON: ${{ needs.changes.outputs.lambdas_json }}
        run: |
          set -euo pipefail
          echo "$LAMBDAS_JSON" | jq -r '.[]' | while read -r name; do
            echo "::group::pytest lambdas/${name}"
            (
              cd "lambdas/${name}"
              pip install -r requirements.txt -r requirements-dev.txt
              pytest
            )
            echo "::endgroup::"
          done

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform validate
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.has_lambdas == 'true' || needs.changes.outputs.deploy_infra == 'true'
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy scope summary
        run: |
          echo "## Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambdas | \`${{ needs.changes.outputs.lambdas_json }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Change base | \`${{ needs.changes.outputs.base_sha || 'n/a' }}\` (${{ needs.changes.outputs.base_source || 'n/a' }}) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Ensure ECR repositories
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          set -euo pipefail
          MISSING=false
          chmod +x "${{ github.workspace }}/scripts/lambda-aws-name.sh"
          for dockerfile in "${{ github.workspace }}"/lambdas/*/Dockerfile; do
            name="$(basename "$(dirname "$dockerfile")")"
            repo="$("${{ github.workspace }}/scripts/lambda-aws-name.sh" "$name")"
            if ! aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "ECR missing: $repo"
              MISSING=true
            fi
          done
          if [ "$MISSING" = "true" ]; then
            terraform apply -auto-approve \
              -var-file="${{ env.TF_VAR_FILE }}" \
              -target=module.ecr
          fi

      - name: Set up Docker Buildx
        if: needs.changes.outputs.has_lambdas == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push changed Lambdas
        if: needs.changes.outputs.has_lambdas == 'true'
        env:
          LAMBDAS_JSON: ${{ needs.changes.outputs.lambdas_json }}
        run: |
          set -euo pipefail
          chmod +x scripts/next-dev-image-tag.sh scripts/lambda-aws-name.sh
          : > images.env
          echo "$LAMBDAS_JSON" | jq -r '.[]' | while read -r name; do
            repo="$(./scripts/lambda-aws-name.sh "$name")"
            tag="$(./scripts/next-dev-image-tag.sh "$repo" "$AWS_REGION")"
            echo "${name}=${tag}" >> images.env
            echo "Building ${repo}:${tag}"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --push \
              --tag "${ECR_REGISTRY}/${repo}:${tag}" \
              --tag "${ECR_REGISTRY}/${repo}:dev-latest" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "./lambdas/${name}"
          done
          cat images.env

      - name: Terraform plan
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          chmod +x "${{ github.workspace }}/scripts/ci-lambda-image-map.sh"
          "${{ github.workspace }}/scripts/ci-lambda-image-map.sh" \
            "$ECR_REGISTRY" \
            "$AWS_REGION" \
            "${{ github.workspace }}/images.env" \
            > lambda_images.auto.tfvars.json
          echo "lambda_images.auto.tfvars.json:"
          cat lambda_images.auto.tfvars.json
          terraform plan \
            -var-file="${{ env.TF_VAR_FILE }}" \
            -var-file=lambda_images.auto.tfvars.json \
            -out=tfplan

      - name: Plan summary
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          echo "## Terraform plan summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")): \(.address)"
          ' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.plan_only }}" = "true" ]; then
            echo "ℹ️ **Plan only**: apply skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏸️ **Awaiting approval** to run \`terraform apply\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Approve Terraform apply
        if: needs.changes.outputs.deploy_infra == 'true' && github.event.inputs.plan_only != 'true'
        uses: trstringer/manual-approval@v1
        timeout-minutes: 120
        with:
          secret: ${{ github.token }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve util-lambdas Terraform apply (run #${{ github.run_number }})"
          issue-body: |
            Review the Terraform plan for ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Comment **approve** to apply, or **deny** to cancel.

      - name: Terraform Apply
        if: needs.changes.outputs.deploy_infra == 'true' && github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply tfplan

      - name: Update Lambda images
        if: needs.changes.outputs.has_lambdas == 'true' && github.event.inputs.plan_only != 'true'
        env:
          LAMBDAS_JSON: ${{ needs.changes.outputs.lambdas_json }}
        run: |
          set -euo pipefail
          [ -f images.env ] || exit 0
          echo "$LAMBDAS_JSON" | jq -r '.[]' | while read -r name; do
            tag="$(awk -F= -v n="$name" '$1==n {print $2}' images.env)"
            [ -n "$tag" ] || continue
            fn="$(./scripts/lambda-aws-name.sh "$name")"
            image="${ECR_REGISTRY}/${fn}:${tag}"
            if ! aws lambda get-function --function-name "$fn" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "Lambda ${fn} not provisioned yet (will exist after infra apply)."
              continue
            fi
            aws lambda update-function-code \
              --function-name "$fn" \
              --image-uri "$image" \
              --region "$AWS_REGION"
            echo "Updated ${fn} → ${image}"
          done

      - name: Deployment Summary
        if: github.event.inputs.plan_only != 'true'
        run: |
          echo "## cht-util-lambdas development deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambdas | \`${{ needs.changes.outputs.lambdas_json }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f images.env ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Image tags:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat images.env >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
